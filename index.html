  daily:true, released:'2026-08-28', tags:['quiz','trivia','korean','casual','daily']
},{

  title:{ko:'끝말잇기',en:'Word Chain'},
  desc:{ko:'AI 와 번갈아 단어를 잇는 한국어 끝말잇기 — 10초 안에 다음 말을 찾아라',en:'Korean word-chain duel against the AI — find the next word in 10 seconds'},

},{
  id:'minesweeper', path:'/minesweeper/',
  title:{ko:'지뢰찾기',en:'Minesweeper'},
  desc:{ko:'숫자를 단서로 지뢰를 피해 칸을 여는 논리 퍼즐 — 찍기 없이 풀리는 판만 냅니다',en:'Classic logic minesweeper — every daily board is solvable without guessing'},

  id:'memory', path:'/memory/',

  playtime:{ko:'한 판 1~3분',en:'1–3 min a round'},
  daily:true, released:'2026-08-31', tags:['puzzle','memory','casual','daily']

let games = FALLBACK;

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tile(g){
  const badges = [
    g.playtime ? `<span class="badge">${esc(g.playtime[lang] || g.playtime.ko)}</span>` : '',
    g.daily ? `<span class="badge daily">🔥 ${esc(T('daily'))}</span>` : ''
  ].join('');
  return `<li><a class="card" href="${esc(g.path)}">
    <span class="thumb"><img src="${esc(g.thumb)}" alt="${esc(g.title[lang] || g.title.ko)}" width="640" height="640" loading="lazy" decoding="async">
      <span class="badges">${badges}</span></span>
    <span class="body"><h2>${esc(g.title[lang] || g.title.ko)}</h2><p>${esc(g.desc[lang] || g.desc.ko)}</p>${playLine(g)}</span>
  </a></li>`;
}

/* 타일 아래 한 줄 — 이 게임을 오늘 몇 판, 통틀어 몇 판 했는지.
   타일은 언어를 바꿀 때마다 다시 그려지므로 data-i18n 을 쓰지 않고 여기서 바로 그 언어로 쓴다.
   게임 이름은 주소에서 뽑는다(/2048/ → 2048) — 집계 키와 같은 값이다. */
function playLine(g){
  const key = String(g.path || '').replace(/^\/|\/$/g, '');
  if (!key) return '';
  const today = `<b data-hp="plays.${key}.today">–</b>`, total = `<b data-hp="plays.${key}.total">–</b>`;
  const text = lang === 'ko' ? `오늘 ${today}판 · 누적 ${total}판`
                             : `${today} today · ${total} all-time`;
  return `<span class="hp-stat" data-hp-line hidden>${text}</span>`;
}

function soonTile(){
  return `<li><div class="card soon"><span class="thumb">🧩</span>
    <span class="body"><h2 data-soon-title>${esc(T('soon'))}</h2><p data-soon-desc>${esc(T('soonDesc'))}</p></span></div></li>`;
}

function render(){
  document.getElementById('grid').innerHTML = games.map(tile).join('') + soonTile();
  /* 다시 그리면 숫자가 지워진다 — 언어 전환·목록 갱신 뒤에 다시 채운다.
     hp-stats.js 는 defer 라 첫 렌더보다 늦을 수 있으므로 있는지 보고 부른다. */
  if (window.hpStats) window.hpStats();
}

function applyLang(){
  document.documentElement.lang = lang;
  document.title = T('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n; if (I18N[lang][k] !== undefined) el.innerHTML = T(k);
  });
  document.getElementById('btnLang').textContent = T('langBtn');
  localStorage.setItem('bp.lang', lang);
  render();
}

document.getElementById('btnLang').onclick = () => { lang = (lang === 'ko') ? 'en' : 'ko'; applyLang(); };

/* 방문 1회 — hp-stats.js 가 defer 라 이 줄보다 늦게 실행된다. 화면이 준비된 뒤에 부른다.
   (세션당 한 번만 세는 것은 hp-stats.js 쪽에서 막는다.) */
const hpVisit = () => { if (window.hpHit) window.hpHit('visit'); };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hpVisit); else hpVisit();

applyLang();

/* ---- 홈 화면에 추가(PWA 설치) ----
   beforeinstallprompt 를 지원하지 않는 브라우저(iOS Safari 등)에서는 이벤트가 오지 않으므로
   버튼이 계속 숨겨진 채로 남는다 — 별도 분기 없이 그것이 의도된 동작이다. */
let deferredPrompt = null;
const installBar = document.getElementById('installBar');
const btnInstall = document.getElementById('btnInstall');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBar.hidden = false;
});
btnInstall.onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBar.hidden = true;
};
window.addEventListener('appinstalled', () => { installBar.hidden = true; });

/* ---- 후원 모달 ---- */
const dlg = document.getElementById('donate');
const closeDonate = () => dlg.classList.remove('show');
document.getElementById('btnDonate').onclick = () => dlg.classList.add('show');
document.getElementById('btnDonateClose').onclick = closeDonate;
dlg.addEventListener('click', e => { if (e.target === dlg) closeDonate(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && dlg.classList.contains('show')) closeDonate(); });

fetch('/games.json', { cache:'no-cache' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(list => { if (Array.isArray(list) && list.length) { games = list; render(); } })
  .catch(() => { /* 폴백 배열로 이미 렌더돼 있음 — 화면은 그대로 동작한다 */ });

/* 타일 클릭 — 목록은 games.json 으로 다시 그려지므로 타일마다 붙이지 않고 문서 한 곳에서
   위임해 받는다. 게임 이름은 링크 주소에서 그대로 읽는다. */
document.addEventListener('click', e => {
  const a = e.target && e.target.closest && e.target.closest('a.card');
  if (!a) return;
  const m = (a.getAttribute('href') || '').match(/^\/([^\/]+)\//);
  if (m) ga('game_open', { game: m[1] });
});
})();
