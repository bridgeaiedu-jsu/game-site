<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="한판고 Hanpango">
  <!-- 흰 판 + 코발트 테두리. 테두리가 잘리지 않도록 1.5 만큼 안쪽으로 넣었다
       (뷰박스 가장자리에 그리면 선의 절반이 밖으로 나가 잘린다). -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <rect x="12" y="12" width="18" height="18" rx="4" fill="#2563eb"/>
  <rect x="34" y="12" width="18" height="18" rx="4" fill="#2563eb"/>
  <rect x="12" y="34" width="18" height="18" rx="4" fill="#2563eb"/>
  <rect x="35.25" y="35.25" width="15.5" height="15.5" rx="2.75"
        fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.35"/>
</svg>
