<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | Page not found — 한판고</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* 색 토큰 — 라이트가 기본, 다크는 아래 @media 에서 같은 이름만 다시 정의(마크업 변경 0).
     시그니처는 포털 기본색 코발트를 쓴다. */
  :root{--bg:#ffffff;--card:#f6f7f9;--text:#111827;--muted:#4b5563;--sig:#2563eb;--sig-ink:#1d4ed8;--on-sig:#ffffff;--line:#e5e7eb}
  @media (prefers-color-scheme: dark){
    :root{--bg:#1e1b4b;--card:#2a2668;--text:#f5f3ff;--muted:#b8b3e6;--sig:#fbbf24;--sig-ink:#fbbf24;--on-sig:#1e1b4b;--line:#3b3784}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;padding:24px}
  main{max-width:420px;width:100%;background:var(--card);border-radius:16px;padding:32px 24px;text-align:center}
  .code{font-size:4rem;font-weight:800;color:var(--sig-ink);line-height:1;margin:0 0 12px}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 20px;font-size:.95rem;line-height:1.5}
  a.btn{display:block;background:var(--sig);color:var(--on-sig);text-decoration:none;font-weight:700;border-radius:12px;padding:14px;margin-top:8px}
  a.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 없는 페이지입니다.<br>The page you're looking for doesn't exist.</p>
  <a class="btn" href="/">🏠 게임 목록으로 · All games</a>
  <a class="btn ghost" href="/block-puzzle/">🧩 블록 퍼즐 · Block Puzzle</a>
  <a class="btn ghost" href="/2048/">🔢 2048</a>
</main>
</body>
</html>
